# The gate this repository's claims depend on.
#
# build -> test -> verify on every push and pull request. The acceptance harness needs a
# session log; CI has none, so a synthetic one is generated first. The harness says which
# it used, because a pass against generated data is weaker evidence than one against a
# real 20 MiB session (that run is a local measurement, reported in the README).
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Generate a synthetic session log
        run: node scripts/make-synthetic-log.mjs "$RUNNER_TEMP/session.jsonl.zstd"

      - name: Verify
        env:
          DSH_LEDGER_LOG: ${{ runner.temp }}/session.jsonl.zstd
        run: npm run verify
